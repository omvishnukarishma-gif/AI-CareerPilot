# Docker Compose for AI CareerPilot â€” PostgreSQL only.
#
# This file is for developers who have Docker Desktop installed.
# If you do NOT have Docker, see README.md â†’ "Option B: Local PostgreSQL"
# for instructions on installing PostgreSQL directly on Windows.

services:
  db:
    image: postgres:16-alpine
    container_name: careerpilot-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careerpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Docker Compose}
      POSTGRES_DB: ${POSTGRES_DB:-careerpilot_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careerpilot}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
