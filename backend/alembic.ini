# Alembic configuration for AI CareerPilot.
#
# The actual database URL is loaded from environment variables in
# alembic/env.py (via app.config.settings), so we don't put any
# credentials in this file.

[alembic]
# Directory where migration scripts live.
script_location = %(here)s/alembic

# Template for auto-generated migration file names.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for file_template timestamps (uses the system timezone if not set).
# timezone = UTC

# Max length of slugified revision name in auto-generated files.
truncate_slug_length = 40

# Set to true to use timezone-aware timestamps in the alembic_version table.
# sqlalchemy.url is intentionally left empty — it is set dynamically in env.py.
sqlalchemy.url =

[post_write_hooks]

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
